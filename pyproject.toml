[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc-xai"
version = "0.1.0"
description = "SPARC: Shapley Pareto Robust Concept attribution with fuzzy logic, post hoc explanations of tabular black box models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Charis Ntakolia", email = "cntakolia@hafa.gr"}]
keywords = ["explainable artificial intelligence", "shapley values", "fuzzy sets", "concept attribution", "multiobjective optimization", "uncertainty quantification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "pymoo>=0.6",
    "joblib>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
interactive = ["matplotlib>=3.7", "plotly>=5.0"]
dev = ["pytest>=7.0", "pytest-cov", "matplotlib>=3.7", "ruff>=0.4"]
docs = ["matplotlib>=3.7", "mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "pymdown-extensions>=10,<12"]
all = ["matplotlib>=3.7", "plotly>=5.0", "pytest>=7.0"]

[project.urls]
Repository = "https://github.com/charis-ntak/sparc"
Issues = "https://github.com/charis-ntak/sparc/issues"
Study = "https://github.com/charis-ntak/pfca"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
